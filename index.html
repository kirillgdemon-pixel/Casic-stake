<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f212e"><title>Sandbox — DEMO</title>
<style>
:root{--bg:#0f212e;--panel:#213743;--card:#1a2c38;--tile:#2f4553;--tile-h:#557086;--green:#00e701;--red:#ed4163;--txt:#b1bad3;--wht:#fff;--blue:#3d8bff}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}button{font-family:inherit;color:inherit}button{touch-action:manipulation}
.top{display:flex;align-items:center;gap:8px;max-width:1080px;margin:0 auto;padding:calc(10px + var(--tg,0px)) 12px 10px}
.brand{flex:1;min-width:0;font-weight:800;font-size:15px;color:var(--wht);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--green);flex:none}
.bal{display:flex;align-items:baseline;gap:5px;background:var(--card);border:0;border-radius:8px;padding:0 10px;height:36px;align-items:center;cursor:pointer}
.bal b{color:var(--wht);font-size:14px}.bal small{font-size:10px;font-weight:700}
.ib{width:36px;height:36px;border:0;border-radius:8px;background:var(--card);color:var(--txt);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover,.ib.on{color:var(--wht);background:#132a3a}.ib.add{background:var(--green);color:#000}
@media(max-width:520px){.brand span{display:none}}
.app{max-width:1080px;margin:0 auto;padding:0 12px 90px;display:flex;flex-direction:column;gap:12px}
.stage{order:1;background:var(--card);border-radius:12px;padding:16px;min-height:360px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.panel{order:2;background:var(--panel);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
@media(min-width:900px){.app{flex-direction:row}.panel{order:1;width:330px;flex:none}.stage{order:2;flex:1;min-height:560px}}
.lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:6px;gap:6px}
.inp{display:flex;background:var(--card);border:2px solid var(--tile);border-radius:8px;overflow:hidden}
.inp:focus-within,.inp:hover{border-color:var(--tile-h)}
.inp input,.inp select{flex:1;min-width:0;width:100%;background:transparent;border:0;outline:0;color:var(--wht);font:600 16px inherit;font-family:inherit;padding:10px 12px}
.inp.ro{opacity:.85}.inp select{appearance:none;-webkit-appearance:none}.inp select option{background:var(--card)}
.mini{background:var(--tile);color:var(--wht);border:0;border-left:2px solid var(--card);padding:0 14px;font-weight:700;cursor:pointer}
.mini:hover{background:var(--tile-h)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:8px;background:var(--green);color:#000;font-weight:800;font-size:16px;padding:15px 14px;cursor:pointer;box-shadow:0 3px 0 #00a300;transition:filter .12s,transform .08s}
.btn:hover:not(:disabled){filter:brightness(1.08)}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #00a300}
.btn:disabled,.mini:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--tile);color:var(--wht);box-shadow:0 3px 0 #1a2c38;font-size:14px;padding:12px}
.swap{background:0;border:0;padding:0;font-weight:700;font-size:12px;color:var(--txt);cursor:pointer}.swap:hover{color:#fff}
.hist{display:flex;justify-content:flex-end;gap:6px;height:30px;overflow:hidden;margin-bottom:6px}
.pill{flex:none;background:var(--tile);color:#fff;font-size:13px;font-weight:700;padding:6px 11px;border-radius:99px}.pill.w{background:var(--green);color:#04210a}
.info{text-align:center;font-weight:700;color:var(--txt);min-height:22px;margin-bottom:8px}.info b{color:#fff}
/* sidebar / modal / stats */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
#sb{position:fixed;top:0;bottom:0;left:0;width:min(280px,82vw);background:var(--panel);z-index:31;transform:translateX(-102%);transition:transform .22s;padding:calc(14px + env(safe-area-inset-top,0px) + var(--tg,0px)) 10px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
#sb.on{transform:none}#sb h3{margin:4px 8px 10px;color:#fff;font-size:15px}
.nv{display:flex;align-items:center;gap:12px;border:0;background:0;border-radius:8px;padding:11px 10px;font-weight:700;font-size:15px;cursor:pointer;text-align:left}
.nv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nv:hover{background:var(--tile);color:#fff}.nv.on{background:var(--tile);color:var(--green)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,92vw);background:var(--panel);border-radius:14px;padding:18px;z-index:41;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;color:#fff;font-size:16px}.q{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#st{position:fixed;z-index:25;left:max(10px,calc(50% - 170px));top:calc(62px + env(safe-area-inset-top,0px));width:340px;max-width:calc(100% - 20px);touch-action:none;cursor:grab;background:var(--panel);border:2px solid var(--tile);border-radius:12px;padding:10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.sg small{display:block;font-size:10px;font-weight:700}.sg b{color:#fff;font-size:15px}
#st svg{width:100%;height:80px;display:block;margin:8px 0;background:var(--card);border-radius:8px}
.sr{display:flex;gap:8px}.sr button{flex:1;padding:9px 4px;font-size:12px}
#tt{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--red);color:#fff;font-weight:700;padding:9px 16px;border-radius:8px;z-index:50}
/* boards */
.dsb{flex:1;display:flex;flex-direction:column;justify-content:center}
.sl{position:relative;height:12px;border-radius:99px;margin:96px 12px 8px;touch-action:none;cursor:pointer}.sl::before{content:"";position:absolute;inset:-18px -10px}
.hd{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:8px;background:var(--blue);box-shadow:0 3px 0 #2a63b8;z-index:2}
.mk{position:absolute;bottom:36px;transform:translateX(-50%);background:#fff;color:#0f212e;font-weight:800;font-size:20px;padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.mk.on{opacity:1}.mk.win{background:var(--green);color:#04210a}.mk.lose{background:var(--red);color:#fff}
.tk{position:relative;height:18px;margin:14px 12px 0;font-size:12px;font-weight:600}.tk span{position:absolute;transform:translateX(-50%)}
.lb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:240px}
.big{font-size:clamp(54px,17vw,112px);font-weight:800;color:#fff;line-height:1}.big.win{color:var(--green)}.big.lose{color:var(--red)}
.grid{display:grid;gap:8px;width:100%;max-width:440px;margin:auto}.g5{grid-template-columns:repeat(5,1fr)}.g8{grid-template-columns:repeat(8,1fr);gap:6px}
.tile{aspect-ratio:1;background:var(--tile);border:0;border-radius:10px;box-shadow:0 4px 0 #1b2f3c;display:grid;place-items:center;padding:0;cursor:pointer;color:#fff;font-weight:800;font-size:14px;transition:background .12s}
.tile:hover:not(.open){background:var(--tile-h)}.tile svg{width:78%;height:78%}
.tile.open{background:#071824;box-shadow:none;animation:rvl .4s cubic-bezier(.2,.8,.3,1.15) backwards}.tile.dim{opacity:.5}.gem svg{filter:drop-shadow(0 0 7px rgba(0,231,1,.65))}
.tile.sel{background:var(--blue)}.tile.hit{background:var(--green);color:#04210a}.tile.dr{outline:2px solid var(--txt)}
@keyframes pop{from{transform:scale(.8)}to{transform:none}}
.cv{display:block;margin:auto;width:min(210px,56vw);filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.cv.in{animation:fly .3s ease-out}@keyframes fly{from{transform:translate(70px,-50px) rotate(12deg);opacity:0}}
.prev{display:flex;gap:6px;justify-content:center;height:62px;margin-top:14px}.prev svg{height:100%;opacity:.7}
canvas{width:100%;display:block;border-radius:8px;max-width:640px;margin:auto}
.tw{display:flex;flex-direction:column-reverse;gap:6px;width:100%;max-width:460px;margin:auto}
.tr{display:flex;gap:6px;align-items:center}.tr b{width:52px;text-align:right;font-size:12px;color:#6f7f99}.tr.act b{color:#fff}
.tr .tile{flex:1;aspect-ratio:auto;height:40px}.tr:not(.act) .tile{pointer-events:none}.tr.act .tile{background:var(--tile-h)}
.gems{display:flex;gap:6px;justify-content:center;margin:auto 0 14px}.gems svg{width:18%;max-width:92px;transition:transform .2s,opacity .2s}
.gems .dm{opacity:.28}.gems .hl{transform:translateY(-8px);filter:drop-shadow(0 0 9px rgba(255,255,255,.7))}
.pt{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:12px;font-weight:700}.pt span{background:var(--panel);border-radius:6px;padding:5px 9px}.pt span.on{background:var(--green);color:#04210a}
.wh{position:relative;width:min(340px,100%);margin:auto}.wh svg{position:absolute;left:50%;top:-8px;width:26px;transform:translateX(-50%);transform-origin:50% 12%;z-index:2}
.tile.shk{animation:shk .07s infinite;background:var(--tile-h)}@keyframes shk{0%{transform:translate(-2px,1px) rotate(-3deg)}50%{transform:translate(2px,-1px) rotate(3deg)}100%{transform:translate(-1px,-1px)}}
.tile.open.fl{animation:rvl .4s cubic-bezier(.2,.8,.3,1.15) backwards,fl .5s}@keyframes rvl{from{opacity:0;transform:perspective(260px) rotateY(80deg) scale(.7)}60%{opacity:1}to{opacity:1;transform:none}}@keyframes fl{0%{filter:brightness(4) saturate(.3)}100%{filter:none}}
.tile.hit{box-shadow:0 4px 0 #00a300,0 0 16px rgba(0,231,1,.85)}
.hr{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}.gh{text-align:center;font-size:11px;font-weight:700}.gh svg,.hcc svg{height:100%;display:block}.hcc{height:135px}.hcc svg.in{animation:fly .3s ease-out;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.hs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px;margin-top:auto;min-height:96px}.hs div{flex:none;text-align:center}.hs svg{height:60px;display:block}.hs b{display:inline-flex;align-items:center;gap:3px;margin-top:4px;background:var(--green);color:#04210a;font-size:11px;padding:2px 6px;border-radius:99px}
.cs{position:relative;overflow:hidden;height:132px;border-radius:10px;background:#0f212e;margin:auto 0}.cst{display:flex;height:100%;will-change:transform}.cb{flex:none;width:88px;padding:10px 4px;transition:transform .35s cubic-bezier(.2,.9,.3,1.3),opacity .3s,filter .3s}.cs.done .cb{opacity:.35}.cs.done .cb.win{opacity:1;transform:scale(1.14);filter:drop-shadow(0 0 10px rgba(255,255,255,.75))}.cb svg{width:100%;height:100%}.cpt{position:absolute;left:50%;bottom:2px;width:18px;margin-left:-9px}
.bt{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:8px}.bh{text-align:center}.bb{display:inline-block;background:var(--panel);color:#fff;font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px;margin-bottom:6px}.bh.act .bb{background:var(--green);color:#04210a}
.cr{display:flex;justify-content:center;height:100px}.cr div{margin-left:-34px}.cr div:first-child{margin-left:0}.cr svg{height:100%;display:block}.cr .in{animation:fly .3s ease-out}
.or{margin-bottom:8px}.oh{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px}.oh i{width:10px;height:10px;border-radius:3px}.oh b{margin-left:auto;color:#fff}.ol{display:flex;justify-content:space-between;align-items:center;padding:3px 0 3px 16px;font-size:13px;font-weight:700}.ol span{min-width:56px;text-align:center;border-radius:6px;padding:2px 8px;font-weight:800}.ol em{font-style:normal;color:#fff}.ort{text-align:center;font-weight:700;border-top:1px solid var(--tile);padding-top:8px}.ort b{color:var(--green)}#pb{max-height:58vh;overflow:auto}
#lob{max-width:1080px;margin:0 auto;padding:4px 12px 96px}
.srch{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--tile);border-radius:10px;padding:0 12px;height:46px}.srch:focus-within{border-color:var(--tile-h)}.srch input{flex:1;min-width:0;background:0;border:0;outline:0;color:#fff;font-size:16px;font-weight:600;font-family:inherit}
.tbs{display:flex;gap:6px;background:var(--card);border-radius:99px;padding:6px;margin:14px 0;overflow-x:auto;scrollbar-width:none;width:fit-content;max-width:100%}.tbs button{flex:none;border:0;background:0;color:var(--txt);font-weight:700;font-size:14px;padding:10px 18px;border-radius:99px;cursor:pointer}.tbs button.on{background:var(--tile);color:#fff}
.lt{color:#fff;font-size:17px;margin:18px 0 12px}
.cds{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.gc{width:100%;aspect-ratio:.72;border:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 6px 10px;cursor:pointer;color:#fff;transition:transform .15s;box-shadow:0 4px 12px rgba(0,0,0,.35)}.gc:hover{transform:translateY(-4px)}.gc span{flex:1;display:grid;place-items:center;width:62%}.gc span svg{width:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}.gc b{font-size:16px;font-weight:900;letter-spacing:.5px}.gc small{font-size:7px;font-weight:800;opacity:.75;letter-spacing:.6px;margin-top:4px}
.pl{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;margin-top:6px}.pl i{width:6px;height:6px;border-radius:50%;background:var(--green)}
#bn{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--tile);padding-bottom:env(safe-area-inset-bottom,0px)}#bn button{flex:1;border:0;background:0;color:var(--txt);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;cursor:pointer}#bn button.on{color:#fff}#bn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:900px){#bn{display:none}}
.rw{overflow-x:auto;margin:auto 0;border-radius:12px;background:#12222d;scrollbar-width:none}.rw::-webkit-scrollbar{display:none}
.rt{position:relative;height:320px;overflow:hidden}
.zs{position:absolute;left:0;top:0;bottom:0;width:110px;background:#182b38;border-right:3px solid #2f4553;overflow:hidden}
.xw{position:absolute;left:0;top:122px;width:100%;height:92px;background:repeating-linear-gradient(90deg,#2f4553 0 22px,transparent 22px 34px)}
.tl{position:absolute;left:18px;top:8px}.tl div{display:flex;gap:6px;background:#2f4553;border-radius:99px;padding:6px;width:max-content}.tl b{width:20px;height:20px;border-radius:50%;background:#1a2c38}.tl b.y{background:#ffc400;box-shadow:0 0 12px #ffc400}.tl i{display:block;width:12px;height:70px;background:#2f4553;margin:-2px auto 0;border-radius:4px}
.bush{position:absolute;left:8px;bottom:-26px;width:80px;height:80px;border-radius:50%;background:#1f3140;box-shadow:34px 14px 0 -10px #1f3140,-14px 18px 0 -12px #1f3140}
.lane{position:absolute;top:0;bottom:0;width:100px;border-left:3px dashed #2f4553}
.mh{position:absolute;left:50%;top:126px;width:64px;height:40px;margin-left:-32px;transition:filter .3s}.mh svg{width:100%;height:100%}
.lane.ok .mh{filter:drop-shadow(0 0 8px #00e701)}.lane.bad .mh{filter:drop-shadow(0 0 8px #ed4163)}
.mp{position:absolute;left:50%;top:184px;transform:translateX(-50%);background:#2f4553;color:#fff;font-weight:800;font-size:14px;padding:8px 12px;border-radius:12px;white-space:nowrap;transition:background .25s}
.lane.ok .mp{background:#00e701;color:#04210a}.lane.nx .mp{background:var(--tile-h)}
.ck{position:absolute;top:92px;width:64px;height:64px;z-index:3;transition:left .42s cubic-bezier(.3,.2,.4,1);pointer-events:none}.cki{width:100%;height:100%}.ck svg{width:100%;height:100%;display:block}
.car{position:absolute;top:70px;width:52px;height:104px;z-index:4;display:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}.car svg{width:100%;height:100%}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8dffbd"/><stop offset=".55" stop-color="#00c46a"/><stop offset="1" stop-color="#007a44"/></linearGradient>
<radialGradient id="bb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#5b6d7e"/><stop offset=".5" stop-color="#1c2a36"/><stop offset="1" stop-color="#05090d"/></radialGradient>
</defs></svg>
<header class="top">
<button class="ib" id="bg" aria-label="Меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

<button class="bal" id="bl"><b id="bv">0.00</b><small>DEMO</small></button>

<button class="ib" id="sb2" aria-label="Статистика"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 15l4-5 4 3 6-8"/></svg></button>

const a=ST.s,n=a.length,mn=Math.min(0,...a),mx=Math.max(0,...a),g=(mx-mn)||1,y=v=>76-(v-mn)/g*72,pts=a.map((v,i)=>((n>1?i/(n-1):0)*300).toFixed(1)+','+y(v).toFixed(1)).join(' ');

function take(){const b=+$('#bet').value;if(!(b>0)){tt('Введите ставку');return null}if(b>S.bal+1e-9){tt('Недостаточно средств');return null}S.bal-=b;S.bet=b;rb();return b}

const BET=()=>`<div><div class="lbl">Ставка</div><div class="inp"><input id="bet" class="lk" type="number" inputmode="decimal" min="0" step="any" value="${S.bet}"><button class="mini lk" data-k="h">½</button><button class="mini lk" data-k="d">2×</button></div></div>`;

/* ---------- SOUND ---------- */
const A={c:null,mute:0},jt=(a=.04)=>1+(R()*2-1)*a;
function ai(){if(A.c){A.c.state=='suspended'&&A.c.resume();return}const c=A.c=new(window.AudioContext||window.webkitAudioContext)();
A.m=c.createGain();A.m.gain.value=.55;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;lp.Q.value=.5;const cp=c.createDynamicsCompressor();cp.threshold.value=-16;cp.ratio.value=3;cp.attack.value=.01;cp.release.value=.2;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=45;hp.Q.value=.6;A.m.connect(hp);hp.connect(lp);lp.connect(cp);cp.connect(c.destination);
const L=c.sampleRate*1.1|0,b=c.createBuffer(2,L,c.sampleRate);for(let h=0;h<2;h++){const d=b.getChannelData(h);let l=0;for(let i=0;i<L;i++){l=l*.7+(R()*2-1)*.3;d[i]=l*3*Math.min(1,i/400)*(1-i/L)**3}}
A.cv=c.createConvolver();A.cv.buffer=b;const rl=c.createBiquadFilter();rl.type='lowpass';rl.frequency.value=3000;const w=c.createGain();w.gain.value=.28;A.cv.connect(rl);rl.connect(w);w.connect(A.m);
const N=c.sampleRate*1.5|0;A.nb=c.createBuffer(1,N,c.sampleRate);const d=A.nb.getChannelData(0);let l=0;for(let i=0;i<N;i++){l=l*.55+(R()*2-1)*.45;d[i]=l*1.8}}
const ok=(...a)=>a.every(x=>typeof x=='number'&&isFinite(x));const out=(g,r)=>{g.connect(A.m);if(r){const s=A.c.createGain();s.gain.value=r;g.connect(s);s.connect(A.cv)}};
function nz(at,d,ty,f0,f1,q,v,r){if(!A.c||A.mute||!ok(at,d,f0,f1,q,v)||f0<=0||f1<=0||d<=0)return;const c=A.c,t=c.currentTime+at+.005,s=c.createBufferSource();s.buffer=A.nb;s.loop=1;const f=c.createBiquadFilter();f.type=ty;f.Q.value=q;f.frequency.setValueAtTime(Math.min(f0,5000),t);f.frequency.exponentialRampToValueAtTime(Math.min(f1,5000),t+d);
const g=c.createGain(),a=Math.min(.012,d*.3);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*jt(.05),t+a);g.gain.exponentialRampToValueAtTime(1e-4,t+d);g.gain.linearRampToValueAtTime(0,t+d+.02);s.connect(f);f.connect(g);out(g,r);s.start(t,R()*.3);s.stop(t+d+.04)}

g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*jt(.05),t+a);g.gain.exponentialRampToValueAtTime(1e-4,t+d);g.gain.linearRampToValueAtTime(0,t+d+.02);o.connect(g);out(g,r);o.start(t);o.stop(t+d+.04)}
const PT=[0,2,4,7,9],pn=(b,d)=>b*2**(PT[d%5]/12+(d/5|0));let lpg=0,lrg=0;
const Snd={
crack(n=0){const f=230*2**(Math.min(n,14)/20);tn(0,f*1.3,f,.09,'sine',.22);nz(0,.06,'bandpass',1500,1000,1.5,.12,.1)},

tick(p=1100){tn(0,p,p*.85,.045,'sine',.14);nz(0,.025,'bandpass',2200,1600,3,.06)},

/* ---------- DICE ---------- */
function dice(){let o=1,t=50.5,bz=0,mx=50;
U(`<div class="dsb"><div class="sl" id="sl"><div class="hd" id="hd"></div><div class="mk" id="mk"></div></div><div class="tk"><span style="left:0">0</span><span style="left:25%">25</span><span style="left:50%">50</span><span style="left:75%">75</span><span style="left:100%">100</span></div></div>`,
`${BET()}<div class="row2"><div><div class="lbl">Множитель</div><div class="inp ro"><input id="dm" readonly></div></div><div><div class="lbl">Шанс, %</div><div class="inp ro"><input id="dc" readonly></div></div></div>
<div><div class="lbl">Цель <button class="swap lk" id="dt"></button></div><div class="inp"><input id="tg" class="lk" type="number" step="0.01"></div></div><button class="btn" id="go">Бросить</button>`);

const $s=$('#sl'),ps=()=>$s.onpointermove=null;$s.onpointerdown=e=>{if(bz)return;$s.setPointerCapture(e.pointerId);mv(e);$s.onpointermove=mv};$s.onpointerup=$s.onpointercancel=$s.onlostpointercapture=ps;
$('#tg').onchange=e=>{const v=parseFloat(e.target.value);t=cl(isFinite(v)?Math.round(v*100)/100:t,.01,99.99);up()};$('#dt').onclick=()=>{if(bz)return;o^=1;up()};
$('#go').onclick=()=>{if(bz)return;const b=take();if(b==null)return;bz=S.busy=1;lk(1);$('#go').disabled=1;
const nw=Math.round(ch()*100),w=R()*1e4<nw,mm=mu(),pk=(a,n)=>Math.round((a+Math.floor(R()*n)/100)*100)/100,
r=o?(w?pk(t+.01,nw):pk(0,Math.round(t*100)+1)):(w?pk(0,nw):pk(t,Math.round((100-t)*100)+1)),k=$('#mk'),f0=mx,t0=performance.now(),D=560;let lq=-1;k.className='mk on';
(function f(now){if(!k.isConnected){S.busy=0;return}const p=cl((now-t0)/D,0,1),v=f0+(r-f0)*(1-(1-p)**3);k.style.left=v+'%';k.textContent=v.toFixed(2);const q=Math.floor(v/12.5);if(q!=lq){lq=q;Snd.tick(650+v*7)}
if(p<1)return requestAnimationFrame(f);mx=r;k.textContent=r.toFixed(2);k.className='mk on '+(w?'win':'lose');w?Snd.win(mm):Snd.lose();pay(b,w?b*mm:0);bz=S.busy=0;lk(0);$('#go').disabled=0})(t0)};up()}

/* ---------- MINES ---------- */
function mines(){let on=0,m=3,bet=0,k=0,mn,op,pd=new Set(),rid=0;S.off=()=>{rid++};
U(`<div class="info" id="mi">&nbsp;</div><div class="grid g5" id="mg">${'<button class="tile"></button>'.repeat(25)}</div>`,
`${BET()}<div><div class="lbl">Мины</div><div class="inp"><select id="ms" class="lk">${Array.from({length:24},(_,i)=>`<option ${i==2?'selected':''}>${i+1}</option>`).join('')}</select></div></div>
<button class="btn alt" id="rd" hidden>Случайная клетка</button><button class="btn" id="go">Ставка</button>`);
const T=[...$('#mg').children],mm=(m,k)=>{let p=1;for(let i=0;i<k;i++)p*=(25-i)/(25-m-i);return .99*p},pa=k=>Math.floor(bet*mm(m,k)*100+1e-6)/100;

const aft=(el,fn,ms)=>{let d=0;const f=()=>{if(d)return;d=1;fn()};el.addEventListener('animationend',f,{once:true});setTimeout(f,ms+120)};

/* ---------- CRASH ---------- */
function crash(){let ph=0,b,cp,t0,cs,lt,hs=[],raf=0,al=1;S.off=()=>{al=0;cancelAnimationFrame(raf)};
U(`<div class="hist" id="ch"></div><canvas id="cv" width="640" height="340"></canvas>`,`${BET()}<button class="btn" id="go">Ставка</button>`);
const cv=$('#cv'),x=cv.getContext('2d'),W=640,H=340,P=28;
